{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $cfg := include "services.mergeConfig" (dict "defaults" $.Values.defaults "service" $svc) | fromYaml }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "services.componentFullname" $ctx }}
  labels:
    {{- include "services.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ $cfg.service.type }}
  ports:
    - name: app
      port: {{ $cfg.service.port }}
      targetPort: {{ $cfg.service.targetPort | default $cfg.containerPort }}
      protocol: TCP
  selector:
    {{- include "services.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
