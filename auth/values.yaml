# Default values for the Marketing Digest auth chart.
# Environment-specific overrides belong in md-helm-values — not here.
#
# Secrets must never be stored in this file. Reference existing
# Kubernetes Secrets via env[].valueFrom or envFrom[].secretRef.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: auth-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Matches auth-service GRPC_PORT default in application config.
containerPort: 50051

service:
  type: ClusterIP
  port: 50051
  targetPort: 50051

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Optional. Empty = omit probes from the Deployment.
livenessProbe: {}
readinessProbe: {}

# Non-sensitive env vars. Sensitive values: valueFrom.secretKeyRef only.
env: []

# Optional envFrom (configMapRef / secretRef). Do not embed secret data.
envFrom: []
