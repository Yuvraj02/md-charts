apiVersion: v1
kind: Service
metadata:
  name: {{ include "blogs.fullname" . }}
  labels:
    {{- include "blogs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default .Values.containerPort }}
      protocol: TCP
  selector:
    {{- include "blogs.selectorLabels" . | nindent 4 }}
